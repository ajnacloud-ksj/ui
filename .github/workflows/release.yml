name: Release
# Publishes @ajnacloud/ui to npm when a merge to main carries a NEW version in
# packages/react/package.json (shaped like the SDK release: the merge is the release).
#
# - Version already on npm: nothing to do (every other merge).
# - Else: the full check gate, `pnpm pack`, the public-content guard on that exact .tgz, then
#   `npm publish <that .tgz> --provenance` through npm TRUSTED PUBLISHING (GitHub OIDC). No npm
#   token is stored anywhere. Then the git tag v<version> on this commit and the GitHub release
#   with the same .tgz attached (a pre-release for a version with a "-").
# - A tag v<version> that already exists stops the run: that version was tagged outside this
#   workflow (for example the GitHub-only 0.1.0-beta.12). Bump the version instead.
#
# One owner step, once: npmjs.com -> @ajnacloud/ui -> Settings -> Trusted Publisher -> GitHub
# Actions: organisation ajnacloud-ksj, repository ui, workflow file release.yml.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Version and whether it is new
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/react/package.json').version")
          name=$(node -p "require('./packages/react/package.json').name")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release version: $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists ($(git rev-parse --short "v$version^{commit}")) but $version is not on npm: it was tagged outside this workflow. Bump packages/react/package.json's version."
            exit 1
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check gate (as ci.yml)
        if: steps.version.outputs.new == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm codegen:check
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm test:package
          node --test scripts/check-public-content.test.mjs scripts/check-packed-content.test.mjs
          node scripts/check-public-content.mjs
      - name: Pack, and guard the exact tarball
        if: steps.version.outputs.new == 'true'
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          (cd packages/react && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          tarball="$RUNNER_TEMP/pack/ajnacloud-ui-$VERSION.tgz"
          test -f "$tarball"
          packed=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          test "$packed" = "$VERSION" || { echo "::error::packed $packed, tag v$VERSION"; exit 1; }
          if tar -xOzf "$tarball" package/package.json | grep -q '"workspace:'; then
            echo "::error::a workspace: dependency is in the packed package.json"; exit 1
          fi
          node scripts/check-packed-content.mjs "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (trusted publishing, provenance)
        if: steps.version.outputs.new == 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1.
          npm install -g npm@11.5.2
          npm publish "$TARBALL" --provenance --access public
      - name: Tag and GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          pre=""; [[ "$VERSION" == *-* ]] && pre="--prerelease"
          gh release create "$TAG" "$TARBALL" $pre --verify-tag \
            --title "@ajnacloud/ui $VERSION" \
            --notes "Published to npm by the Release workflow from $GITHUB_SHA, with provenance. The attached .tgz is the published tarball: integrity \`$INTEGRITY\`."
