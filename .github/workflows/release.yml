name: Release
# Publishes @ajnacloud/ui to npm when a merge to main carries a NEW version in
# packages/react/package.json (shaped like the SDK release: the merge is the release).
#
# Two jobs, so no install or build script ever runs where a publish credential exists:
# - build (contents: read, no id-token): version check, the full check gate, `pnpm pack`, the
#   public-content guard on that exact .tgz; it uploads the .tgz and its sha512.
# - publish (id-token: write, contents: write): no checkout, no install. It downloads the .tgz,
#   re-checks its sha512, runs `npm publish <that .tgz> --provenance` through npm TRUSTED
#   PUBLISHING (GitHub OIDC; no npm token stored anywhere), then creates the tag v<version> on this
#   commit and the GitHub release with the same .tgz.
#
# - Version already on npm: nothing to do (every other merge).
# - A tag v<version> that exists while the version is not on npm stops the run: that version was
#   tagged outside this workflow (for example the GitHub-only 0.1.0-beta.12). Bump the version.
# - A version with a "-" is published under the dist-tag of its prerelease id (0.1.0-beta.13 ->
#   "beta"), so "latest" moves only for a stable version; its GitHub release is a pre-release.
#
# One owner step, once: npmjs.com -> @ajnacloud/ui -> Settings -> Trusted Publisher -> GitHub
# Actions: organisation ajnacloud-ksj, repository ui, workflow file release.yml.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new: ${{ steps.version.outputs.new }}
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version and whether it is new
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/react/package.json').version")
          name=$(node -p "require('./packages/react/package.json').name")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-([0-9A-Za-z]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::not a release version: $version"; exit 1
          fi
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            pre=${version#*-}
            dist_tag=${pre%%.*}
            if [[ ! "$dist_tag" =~ ^[A-Za-z][0-9A-Za-z]*$ ]]; then
              echo "::error::the prerelease id of $version is not a dist-tag name"; exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists ($(git rev-parse --short "v$version^{commit}")) but $version is not on npm: it was tagged outside this workflow. Bump packages/react/package.json's version."
            exit 1
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check gate (as ci.yml)
        if: steps.version.outputs.new == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm codegen:check
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm test:package
          node --test scripts/check-public-content.test.mjs scripts/check-packed-content.test.mjs
          node scripts/check-public-content.mjs
      - name: Pack, and guard the exact tarball
        if: steps.version.outputs.new == 'true'
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          (cd packages/react && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          tarball="$RUNNER_TEMP/pack/ajnacloud-ui-$VERSION.tgz"
          test -f "$tarball"
          packed=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          test "$packed" = "$VERSION" || { echo "::error::packed $packed, tag v$VERSION"; exit 1; }
          if tar -xOzf "$tarball" package/package.json | grep -q '"workspace:'; then
            echo "::error::a workspace: dependency is in the packed package.json"; exit 1
          fi
          node scripts/check-packed-content.mjs "$tarball"
          echo "integrity=sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: ${{ runner.temp }}/pack/ajnacloud-ui-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: ${{ runner.temp }}/pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Re-check the tarball the build job guarded
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/pack/ajnacloud-ui-$VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          test "$got" = "$INTEGRITY" || { echo "::error::the tarball changed between jobs"; exit 1; }
      - name: Publish to npm (trusted publishing, provenance)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1. No install script of this repo runs here.
          npm install -g npm@11.5.2
          npm publish "$RUNNER_TEMP/pack/ajnacloud-ui-$VERSION.tgz" --provenance --access public --tag "$DIST_TAG"
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" >/dev/null
          pre=""; [[ "$VERSION" == *-* ]] && pre="--prerelease"
          gh release create "v$VERSION" "$RUNNER_TEMP/pack/ajnacloud-ui-$VERSION.tgz" $pre --verify-tag \
            -R "$GITHUB_REPOSITORY" \
            --title "@ajnacloud/ui $VERSION" \
            --notes "Published to npm (dist-tag \`$DIST_TAG\`) by the Release workflow from $GITHUB_SHA, with provenance. The attached .tgz is the published tarball: integrity \`$INTEGRITY\`."
